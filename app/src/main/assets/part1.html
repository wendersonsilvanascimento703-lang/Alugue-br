<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176B46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AlugueBR">
<title>AlugueBR</title>
<style>
:root{--g:#176B46;--bg:#F6F7F9;--t:#1D2521;--m:#6B7771;--b:#D8E0DC;--s:#E8EFEB;--d:#A33131}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}.app{width:min(100%,760px);margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px}.brand{color:var(--g);font-size:25px;font-weight:900;border:0;background:none;padding:0}
.link,.back{border:0;background:none;color:var(--g);font-weight:800;padding:4px 0}.card,.panel{background:white;border-radius:22px;padding:20px}
.hero small{color:var(--g);font-weight:900;letter-spacing:1px}.hero h1{font-size:clamp(30px,8vw,40px);line-height:1.08;margin:8px 0}
.muted{color:var(--m);font-size:13px}.btn{width:100%;min-height:52px;border:0;border-radius:15px;font-weight:900;font-size:16px;margin-top:16px;background:var(--g);color:#fff}
.btn:disabled{opacity:.55}.danger{background:#FBEAEA;color:var(--d)}.filters{margin-top:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin-top:11px}label span{display:block;font-size:12px;font-weight:800;color:#52615A;margin-bottom:6px}
input,textarea{width:100%;min-height:48px;border:1px solid var(--b);border-radius:13px;background:#FAFBFB;padding:12px;font-size:15px;outline:none}
textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(23,107,70,.1)}
.heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.heading h2{margin:0;font-size:19px}.pill{background:var(--s);border-radius:15px;padding:6px 9px;font-size:13px;font-weight:800}
.grid{display:grid;gap:14px}.listing{border:0;background:white;border-radius:20px;overflow:hidden;text-align:left;padding:0;color:inherit}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#E8ECEA}.empty{display:grid;place-items:center;color:#78847E;font-weight:700}
.body{padding:15px}.loc{color:var(--g);font-size:12px;font-weight:800;margin:0}.title{font-size:19px;font-weight:900;margin:7px 0}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.price{font-size:20px;font-weight:900}
.status{background:white;border-radius:18px;padding:18px;color:var(--m)}.hidden{display:none!important}.viewhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;background:#E9EEEB}.pic{min-width:100%;height:min(62vw,390px);scroll-snap-align:start}.pic img{width:100%;height:100%;object-fit:cover}
.details{background:white;border-radius:22px;padding:20px;margin-top:16px}.details h1{font-size:28px;line-height:1.18;margin:8px 0}.big{font-size:27px;font-weight:900;margin-top:15px}.divider{height:1px;background:#E7ECE9;margin:18px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#F1F4F2;padding:5px;border-radius:14px;margin-top:14px}.tab{border:0;border-radius:10px;min-height:40px;background:transparent;font-weight:800;color:#68756E}.tab.on{background:#fff;color:var(--g)}
.msg{font-size:13px;margin-top:10px}.err{color:var(--d);font-weight:700}.ok{color:var(--g);font-weight:700}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px}
